# Netlify: statische Oberfläche aus public/, API als Function, Datenbank über Netlify DB (Postgres).
[build]
  publish = "public"
  command = "echo 'keine Build-Schritte nötig'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["express", "serverless-http", "web-push", "@netlify/neon", "@neondatabase/serverless", "pg"]

[functions.api]
  included_files = ["server/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
