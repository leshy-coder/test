# Netlify: statische Oberfläche aus public/, API als Function (/api/*), Datenbank über Netlify DB (Postgres).
[build]
  publish = "public"
  command = "echo 'keine Build-Schritte nötig'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["express", "serverless-http", "web-push", "pg", "@netlify/database"]

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
